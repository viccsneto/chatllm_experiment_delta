<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ChatLLM Lab</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css"
    />
    <style>
      :root {
        --bg-page: #ffffff;
        --text: #0d0d0d;
        --muted: #8e8ea0;
        --accent: #1a1a1a;
        --accent-hover: #404040;
        --user-bubble: #f4f4f4;
        --border: #e5e5e5;
        --composer-bg: #ffffff;
        --composer-border: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bg-page);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .app-shell {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        min-height: 0;
        background: #f4f5f7;
      }

      .sidebar {
        flex: 0 0 280px;
        min-width: 240px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: #fafbfc;
        padding: 20px;
        gap: 18px;
        overflow-y: auto;
      }

      .sidebar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .sidebar-actions {
        display: flex;
        gap: 8px;
      }

      .sidebar-header button {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 12px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
        transition: transform 150ms ease, background 150ms ease;
      }

      .clear-history {
        background: #f7e1e0;
        color: #922d2d;
      }

      .clear-history:hover {
        background: #f3c8c5;
      }

      .sidebar-header button:hover {
        transform: translateY(-1px);
        background: #f4f4f6;
      }

      .session-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .session-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
      }

      .session-item:hover {
        border-color: #c1c4cc;
        box-shadow: 0 1px 6px rgba(15, 23, 42, 0.08);
      }

      .session-item.active {
        border-color: var(--accent);
        background: #1a1a1a;
        color: #fff;
      }

      .session-badge {
        background: #eef2f7;
        color: var(--muted);
        font-size: 0.78rem;
        border-radius: 999px;
        padding: 4px 10px;
      }

      .chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .app-header {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      .session-title {
        font-size: 0.92rem;
        color: var(--muted);
      }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 28px 20px 20px;
      }

      .messages-inner {
        max-width: 860px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .bubble {
        line-height: 1.75;
        word-break: break-word;
        overflow-wrap: anywhere;
        animation: slideUp 180ms ease-out;
        padding: 18px 20px;
        border-radius: 22px;
        margin-bottom: 0;
        width: auto;
        max-width: 86%;
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.06);
      }

      .bubble.assistant {
        align-self: flex-start;
        background: #ffffff;
        color: var(--text);
        border: 1px solid #e7e9ee;
      }

      .bubble.user {
        align-self: flex-end;
        background: #111827;
        color: #f9fafb;
        border-radius: 22px;
        max-width: 78%;
      }

      .brand {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text);
        letter-spacing: 0;
      }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 32px 16px 16px;
      }

      .bubble pre {
        margin: 12px 0;
        padding: 16px;
        border-radius: 12px;
        overflow-x: auto;
        background: #f4f4f4;
        border: 1px solid var(--border);
        font-size: 0.875rem;
      }

      .code-block-wrap {
        position: relative;
      }

      .code-copy-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(17, 24, 39, 0.75);
        color: #f9fafb;
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 0.73rem;
        cursor: pointer;
        z-index: 2;
      }

      .code-copy-btn:hover {
        background: rgba(31, 41, 55, 0.95);
      }

      .bubble code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.875em;
      }

      .bubble :not(pre) > code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #f4f4f4;
        border: 1px solid var(--border);
        font-size: 0.875em;
      }

      .composer-wrap {
        flex-shrink: 0;
        padding: 8px 16px 20px;
      }

      .note {
        max-width: 720px;
        margin: 0 auto 8px;
        padding: 4px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .error {
        color: #c0392b;
      }

      .warning-banner {
        flex-shrink: 0;
        text-align: center;
        padding: 8px 16px;
        color: #e53e3e;
        font-weight: 600;
        font-size: 0.85rem;
        background: #fff5f5;
        border-bottom: 1px solid #fed7d7;
      }

      .composer {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--composer-bg);
        border: 1px solid var(--composer-border);
        border-radius: 28px;
        padding: 8px 10px 8px 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .composer:focus-within {
        border-color: #b0b0b0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      }

      .composer input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 6px 0;
        font: inherit;
        font-size: 1rem;
        color: var(--text);
        outline: none;
      }

      .composer input::placeholder {
        color: var(--muted);
      }

      .composer button {
        flex-shrink: 0;
        border: 0;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background 120ms ease, transform 100ms ease;
      }

      .composer button:hover:not(:disabled) {
        background: var(--accent-hover);
        transform: scale(1.05);
      }

      .composer button:disabled {
        background: #d9d9d9;
        cursor: not-allowed;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Auth Page Styles */
      .auth-page {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .auth-container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        width: 100%;
        max-width: 420px;
      }

      .auth-container h1 {
        text-align: center;
        margin: 0 0 30px;
        font-size: 28px;
        color: #1a1a1a;
      }

      .auth-form h2 {
        text-align: center;
        margin: 0 0 24px;
        font-size: 20px;
        color: #0d0d0d;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #0d0d0d;
        font-size: 14px;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 150ms ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-group input:disabled {
        background: #f4f4f4;
        cursor: not-allowed;
      }

      .error-message {
        background: #fee;
        border: 1px solid #fcc;
        color: #922d2d;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }

      .auth-form button[type="submit"] {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 100ms ease, box-shadow 100ms ease;
        margin-bottom: 16px;
      }

      .auth-form button[type="submit"]:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .auth-form button[type="submit"]:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .auth-footer {
        text-align: center;
        font-size: 14px;
        color: #666;
      }

      .link-button {
        background: none;
        border: none;
        color: #667eea;
        cursor: pointer;
        font-weight: 600;
        text-decoration: underline;
      }

      .link-button:hover {
        color: #764ba2;
      }

      /* Header User Logout */
      .header-user {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }

      .user-email {
        font-size: 14px;
        color: var(--muted);
      }

      .logout-btn {
        padding: 8px 16px;
        background: #f7e1e0;
        color: #922d2d;
        border: 1px solid #e8bfbb;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: background 150ms ease, color 150ms ease;
      }

      .logout-btn:hover {
        background: #f3c8c5;
        color: #6b2020;
      }

      .loading {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
        font-size: 18px;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .bubble.user { max-width: 90%; }
        .messages { padding: 20px 12px 12px; }
        .composer-wrap { padding: 8px 12px 16px; }
        .auth-container { padding: 24px; max-width: 90%; }
        .header-user { flex-direction: column; gap: 8px; align-items: flex-end; }
      }    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
    <script type="text/babel" src="/frontend/src/api.js"></script>
    <script type="text/babel" src="/frontend/src/MessageContent.jsx"></script>
    <script type="text/babel" src="/frontend/src/Composer.jsx"></script>
    <script type="text/babel" src="/frontend/src/AuthPage.jsx"></script>
    <script type="text/babel" src="/frontend/src/App.jsx"></script>
  </body>
</html>
