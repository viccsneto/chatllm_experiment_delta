<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ChatLLM Lab</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css"
    />
    <style>
      :root {
        --bg-page: #ffffff;
        --text: #0d0d0d;
        --muted: #8e8ea0;
        --accent: #1a1a1a;
        --accent-hover: #404040;
        --user-bubble: #f4f4f4;
        --border: #e5e5e5;
        --composer-bg: #ffffff;
        --composer-border: #d9d9d9;
        --sidebar-width: 260px;
        --sidebar-bg: #f9f9f9;
        --sidebar-hover: #eeeeee;
        --sidebar-active: #e3e3e3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bg-page);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      /* ── Layout ── */
      .app-layout {
        width: 100%;
        height: 100%;
        display: flex;
      }

      /* ── Sidebar ── */
      .sidebar {
        width: var(--sidebar-width);
        min-width: var(--sidebar-width);
        height: 100%;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        transition: margin-left 200ms ease, opacity 200ms ease;
      }
      .sidebar.closed {
        margin-left: calc(-1 * var(--sidebar-width));
        opacity: 0;
        pointer-events: none;
      }
      .sidebar-header {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .sidebar-new-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg-page);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        color: var(--text);
        transition: background 120ms ease;
      }
      .sidebar-new-btn:hover:not(:disabled) {
        background: var(--sidebar-hover);
      }
      .sidebar-new-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .sidebar-loading,
      .sidebar-empty {
        padding: 24px 12px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .sidebar-item {
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 2px;
        transition: background 120ms ease;
      }
      .sidebar-item:hover {
        background: var(--sidebar-hover);
      }
      .sidebar-item.active {
        background: var(--sidebar-active);
      }
      .sidebar-item-title {
        font-size: 0.9rem;
        font-weight: 500;
        line-height: 1.3;
        word-break: break-word;
      }
      .sidebar-item-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 4px;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .sidebar-delete-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 2px 4px;
        border-radius: 4px;
        transition: background 120ms ease, color 120ms ease;
      }
      .sidebar-delete-btn:hover:not(:disabled) {
        background: #e8e8e8;
        color: #c0392b;
      }
      .sidebar-delete-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── Sidebar toggle buttons ── */
      .sidebar-toggle-open,
      .sidebar-toggle-closed {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 4px 8px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        transition: background 120ms ease;
      }
      .sidebar-toggle-open:hover,
      .sidebar-toggle-closed:hover {
        background: var(--sidebar-hover);
        color: var(--text);
      }
      .sidebar-toggle-open {
        margin-left: auto;
      }
      .sidebar-toggle-closed {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: var(--sidebar-bg);
        border: 1px solid var(--border);
        padding: 6px 8px;
      }

      .app-shell {
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        flex-shrink: 0;
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        text-align: center;
      }

      .brand {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text);
        letter-spacing: 0;
      }

      .messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 32px 16px 16px;
      }

      .messages-inner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .bubble {
        line-height: 1.65;
        word-break: break-word;
        overflow-wrap: anywhere;
        animation: slideUp 180ms ease-out;
        padding: 20px 0;
      }

      .bubble + .bubble {
        border-top: none;
      }

      .bubble.assistant {
        align-self: flex-start;
        width: 100%;
        font-size: 1rem;
        color: var(--text);
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--user-bubble);
        padding: 12px 18px;
        border-radius: 18px;
        max-width: 78%;
        font-size: 1rem;
      }

      .bubble pre {
        margin: 12px 0;
        padding: 16px;
        border-radius: 12px;
        overflow-x: auto;
        background: #f4f4f4;
        border: 1px solid var(--border);
        font-size: 0.875rem;
      }

      .code-block-wrap {
        position: relative;
      }

      .code-copy-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(17, 24, 39, 0.75);
        color: #f9fafb;
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 0.73rem;
        cursor: pointer;
        z-index: 2;
      }

      .code-copy-btn:hover {
        background: rgba(31, 41, 55, 0.95);
      }

      .bubble code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.875em;
      }

      .bubble :not(pre) > code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #f4f4f4;
        border: 1px solid var(--border);
        font-size: 0.875em;
      }

      .composer-wrap {
        flex-shrink: 0;
        padding: 8px 16px 20px;
      }

      .note {
        max-width: 720px;
        margin: 0 auto 8px;
        padding: 4px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .error {
        color: #c0392b;
      }

      .warning-banner {
        flex-shrink: 0;
        text-align: center;
        padding: 8px 16px;
        color: #e53e3e;
        font-weight: 600;
        font-size: 0.85rem;
        background: #fff5f5;
        border-bottom: 1px solid #fed7d7;
      }

      .composer {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--composer-bg);
        border: 1px solid var(--composer-border);
        border-radius: 28px;
        padding: 8px 10px 8px 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .composer:focus-within {
        border-color: #b0b0b0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      }

      .composer input {
        flex: 1;
        border: none;
        background: transparent;
        padding: 6px 0;
        font: inherit;
        font-size: 1rem;
        color: var(--text);
        outline: none;
      }

      .composer input::placeholder {
        color: var(--muted);
      }

      .composer button {
        flex-shrink: 0;
        border: 0;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition: background 120ms ease, transform 100ms ease;
      }

      .composer button:hover:not(:disabled) {
        background: var(--accent-hover);
        transform: scale(1.05);
      }

      .composer button:disabled {
        background: #d9d9d9;
        cursor: not-allowed;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Auth Screen ── */
      .auth-screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--sidebar-bg);
      }
      .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 40px 32px;
        background: var(--bg-page);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      }
      .auth-title {
        font-size: 1.3rem;
        font-weight: 700;
        text-align: center;
        margin: 0 0 4px;
      }
      .auth-subtitle {
        font-size: 0.95rem;
        font-weight: 500;
        text-align: center;
        color: var(--muted);
        margin: 0 0 24px;
      }
      .auth-error {
        padding: 10px 14px;
        background: #fff5f5;
        border: 1px solid #fed7d7;
        border-radius: 8px;
        color: #c0392b;
        font-size: 0.85rem;
        margin-bottom: 16px;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .auth-row {
        display: flex;
        gap: 8px;
      }
      .auth-row .auth-input {
        flex: 1;
      }
      .auth-input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--composer-border);
        border-radius: 10px;
        font: inherit;
        font-size: 0.95rem;
        color: var(--text);
        outline: none;
        transition: border-color 150ms ease;
        box-sizing: border-box;
      }
      .auth-input:focus {
        border-color: #b0b0b0;
      }
      .auth-hint {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .auth-submit {
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 120ms ease;
      }
      .auth-submit:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .auth-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .auth-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .auth-link {
        background: none;
        border: none;
        color: var(--accent);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }
      .auth-link:hover {
        color: var(--accent-hover);
      }

      /* ── User area (sidebar footer) ── */
      .sidebar-footer {
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        padding: 8px;
        position: relative;
      }
      .user-avatar-btn {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: none;
        border-radius: 8px;
        background: none;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
        color: var(--text);
        transition: background 120ms ease;
      }
      .user-avatar-btn:hover {
        background: var(--sidebar-hover);
      }
      .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.85rem;
        flex-shrink: 0;
      }
      .user-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .user-menu {
        position: absolute;
        bottom: 100%;
        left: 8px;
        right: 8px;
        background: var(--bg-page);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
        padding: 12px;
        margin-bottom: 4px;
      }
      .user-menu-header {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .user-menu-name {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .user-menu-email {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .user-menu-logout {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: none;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
        color: #c0392b;
        transition: background 120ms ease;
      }
      .user-menu-logout:hover {
        background: #fff5f5;
      }

      @media (max-width: 640px) {
        .bubble.user { max-width: 90%; }
        .messages { padding: 20px 12px 12px; }
        .composer-wrap { padding: 8px 12px 16px; }
        .sidebar {
          position: fixed;
          left: 0;
          top: 0;
          z-index: 100;
          box-shadow: 4px 0 12px rgba(0,0,0,0.1);
        }
        .sidebar.closed {
          margin-left: calc(-1 * var(--sidebar-width));
        }
        .sidebar.open {
          margin-left: 0;
        }
      }    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
    <script type="text/babel" src="/frontend/src/api.js"></script>
    <script type="text/babel" src="/frontend/src/AuthScreen.jsx"></script>
    <script type="text/babel" src="/frontend/src/MessageContent.jsx"></script>
    <script type="text/babel" src="/frontend/src/Composer.jsx"></script>
    <script type="text/babel" src="/frontend/src/App.jsx"></script>
  </body>
</html>
